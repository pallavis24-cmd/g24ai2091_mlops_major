name: Docker CI/CD Pipeline

on:
  push:
    branches: [ "docker_cicd", "main" ]
  pull_request:
    branches: [ "docker_cicd", "main" ]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2
    
    - name: Log in to Docker Hub
      if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKER_USERNAME }}
        password: ${{ secrets.DOCKER_PASSWORD }}
    
    - name: Extract metadata for Docker
      id: meta
      uses: docker/metadata-action@v4
      with:
        images: pallavis24/olivetti-classifier
        tags: |
          type=raw,value=latest
          type=sha,prefix={{branch}}-
    
    - name: Build Docker image (without push)
      if: ${{ secrets.DOCKER_USERNAME == '' || secrets.DOCKER_PASSWORD == '' }}
      uses: docker/build-push-action@v4
      with:
        context: ./FINAL
        file: ./FINAL/Dockerfile
        push: false
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
    
    - name: Build and push Docker image
      if: ${{ secrets.DOCKER_USERNAME != '' && secrets.DOCKER_PASSWORD != '' }}
      uses: docker/build-push-action@v4
      with:
        context: ./FINAL
        file: ./FINAL/Dockerfile
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=registry,ref=pallavis24/olivetti-classifier:latest
        cache-to: type=inline
    
    - name: Build status
      run: |
        if [ -z "${{ secrets.DOCKER_USERNAME }}" ] || [ -z "${{ secrets.DOCKER_PASSWORD }}" ]; then
          echo " Docker Hub credentials not configured. Image built but not pushed."
          echo "To enable pushing, add DOCKER_USERNAME and DOCKER_PASSWORD secrets in repository settings."
        else
          echo " Docker image built and pushed successfully!"
        fi
