apiVersion: apps/v1
kind: Deployment
metadata:
  name: olivetti-classifier
  labels:
    app: olivetti-classifier
spec:
  replicas: 3
  selector:
    matchLabels:
      app: olivetti-classifier
  template:
    metadata:
      labels:
        app: olivetti-classifier
    spec:
      containers:
      - name: olivetti-classifier
        image: pallavis24/olivetti-classifier:latest
        ports:
        - containerPort: 5000
          name: http
        env:
        - name: FLASK_APP
          value: "app.py"
        - name: PYTHONUNBUFFERED
          value: "1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
---
apiVersion: v1
kind: Service
metadata:
  name: olivetti-classifier-service
  labels:
    app: olivetti-classifier
spec:
  type: LoadBalancer
  selector:
    app: olivetti-classifier
  ports:
  - protocol: TCP
    port: 80
    targetPort: 5000
    name: http
